<!DOCTYPE html>
<html lang="fa">

<head>
    <base href="https://cdn.jsdelivr.net/gh/Craftingdead/hollow-knight@latest/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Hollow Knight — نسخهٔ سه‌پارتی</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #231F20;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        .fa-ui {
            direction: rtl;
            font-family: Tahoma, Verdana, sans-serif;
        }

        #loading-box {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 0 20px;
        }

        #loading-title {
            font-size: clamp(20px, 5vw, 40px);
        }

        #loading-sub {
            color: #bdb5b7;
            font-size: clamp(13px, 2.6vw, 17px);
            min-height: 1.3em;
        }

        #dl-bar-empty {
            width: min(520px, 86vw);
            height: 16px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 9px;
            overflow: hidden;
        }

        #dl-bar-full {
            height: 100%;
            width: 0%;
            background: #7ec850;
            transition: width 0.15s linear;
        }

        .hk-btn {
            background: rgba(35, 31, 32, 0.85);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 15px;
            cursor: pointer;
            font-family: inherit;
        }

        .hk-btn.primary {
            background: #3d7a26;
            border-color: #7ec850;
        }

        #fs-button {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 10;
        }

        #parts-button {
            position: fixed;
            left: 12px;
            bottom: 12px;
            z-index: 10;
        }

        #parts-panel {
            position: fixed;
            left: 12px;
            bottom: 64px;
            z-index: 11;
            max-width: min(420px, 92vw);
            background: rgba(24, 21, 22, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 10px;
            color: white;
            padding: 14px 16px;
            font-size: 14px;
            line-height: 1.9;
        }

        #parts-panel .bar-empty {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            overflow: hidden;
            margin: 6px 0;
        }

        #parts-panel .bar-full {
            height: 100%;
            width: 0%;
            background: #7ec850;
        }

        #gate-banner {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            width: min(520px, 94vw);
            background: rgba(24, 21, 22, 0.96);
            border: 1px solid #7ec850;
            border-radius: 10px;
            color: white;
            padding: 14px 16px;
            font-size: 15px;
            line-height: 1.9;
            text-align: center;
        }

        #gate-banner .row,
        #parts-panel .row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>
    <div id="loading-box" class="fa-ui">
        <div id="loading-title">در حال بارگذاری…</div>
        <div id="dl-bar-empty">
            <div id="dl-bar-full"></div>
        </div>
        <div id="loading-sub"></div>
        <button id="dl-cancel" class="hk-btn" hidden>لغو دانلود</button>
        <button id="dl-retry" class="hk-btn primary" hidden>تلاش مجدد</button>
    </div>

    <div hidden id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-mobile-warning">Tip: rotate your phone to landscape and use the fullscreen button for the best experience.</div>
    </div>

    <button id="fs-button" class="hk-btn" hidden>&#x26F6; تمام‌صفحه</button>
    <button id="parts-button" class="hk-btn fa-ui" hidden>📦 پارت‌های بازی</button>

    <div id="parts-panel" class="fa-ui" hidden>
        <div id="parts-info"></div>
        <div class="bar-empty" id="parts-bar-wrap" hidden>
            <div class="bar-full" id="parts-bar"></div>
        </div>
        <div id="parts-progress-text"></div>
        <div class="row">
            <button id="parts-download" class="hk-btn primary" hidden>دانلود پارت بعدی</button>
            <button id="parts-close" class="hk-btn">بستن</button>
        </div>
    </div>

    <div id="gate-banner" class="fa-ui" hidden>
        <div id="gate-text"></div>
        <div class="row">
            <button id="gate-download" class="hk-btn primary">دانلود پارت بعدی</button>
            <button id="gate-later" class="hk-btn">بعداً</button>
        </div>
    </div>

    <script>
        "use strict";

        // ============ Three-part loader (PLAN hk-parts, M2) ============
        // hk.data is assembled in the browser from stage-tagged segments
        // (Cache Storage "hk-parts-v1") + pipeline patch files + locally
        // generated zero-LZ4 placeholder blocks for locked stages, exactly
        // per spec_stage<N>.json produced by pipeline/segment.py.
        // The page URL never changes across upgrades (saves are keyed to
        // the URL directory), the installed stage lives in localStorage.

        const PARTS_BASE = new URL("parts/v1/", window.location.href).href;
        // Test/hosting override: ?manifest=<url> points at another manifest
        // (segment/spec/patch entries may then be absolute URLs).
        const MANIFEST_URL = new URLSearchParams(window.location.search).get("manifest") || (PARTS_BASE + "manifest.json");
        const resolveParts = (f) => /^https?:\/\//.test(f) ? f : PARTS_BASE + f;
        const CACHE_NAME = "hk-parts-v1";
        const LS_STAGE = "hk.installedStage";
        const LS_GATE_SNOOZE = "hk.gateSnoozeUntil";
        const CONCURRENCY = 3;
        const MAX_RETRIES = 3;
        const WASM_PARTS = 2;
        // Render target (M3): fixed internal render 854x480 (480p) on
        // mobile, CSS-stretched to fullscreen; 30 FPS cap below.
        const RENDER_W = 854;
        const RENDER_H = 480;
        const FPS_CAP = 30;

        // Checkpoint gates (initial lists from PLAN 4.4; refined in M4).
        const GATE_SCENES = {
            1: ["Town", "Crossroads_46b", "Crossroads_49b"],       // -> prompt part 2
            2: [],                                                  // prefix rule below
        };
        const GATE_PREFIXES = { 2: ["Waterways_"] };                // -> prompt part 3

        // ---------- 30 FPS cap (M3) ----------
        // Wrap requestAnimationFrame BEFORE the Unity framework loads:
        // queued callbacks are delivered at most every 1000/30 ms with the
        // real rAF timestamp, so Unity's deltaTime stays real-time and only
        // rendering is capped (physics uses its own fixed timestep).
        // Also maintains a 1-second FPS counter (window.__hkFps) and, with
        // ?fps=1 in the URL, a small on-screen FPS badge for phone tests.
        const __fpsState = { frames: 0, value: 0, lastCalc: performance.now() };
        window.__hkFps = () => __fpsState.value;
        (function installFpsCap() {
            const origRAF = window.requestAnimationFrame.bind(window);
            const origCancel = window.cancelAnimationFrame ? window.cancelAnimationFrame.bind(window) : null;
            let queue = [], nextId = 1, lastDeliver = 0, loopStarted = false;
            function loop(t) {
                origRAF(loop);
                if (t - lastDeliver >= 1000 / FPS_CAP - 0.5 && queue.length) {
                    lastDeliver = t;
                    const q = queue; queue = [];
                    for (const item of q) {
                        __fpsState.frames++;
                        try { item.cb(t); } catch (e) { console.error(e); }
                    }
                }
                const now = performance.now();
                if (now - __fpsState.lastCalc >= 1000) {
                    __fpsState.value = __fpsState.frames;
                    __fpsState.frames = 0;
                    __fpsState.lastCalc = now;
                    const badge = document.getElementById("fps-badge");
                    if (badge) badge.textContent = __fpsState.value + " FPS";
                }
            }
            window.requestAnimationFrame = (cb) => {
                const id = nextId++;
                queue.push({ id, cb });
                if (!loopStarted) { loopStarted = true; origRAF(loop); }
                return id;
            };
            window.cancelAnimationFrame = (id) => { queue = queue.filter(q => q.id !== id); };
            if (new URLSearchParams(window.location.search).get("fps") === "1") {
                const badge = document.createElement("div");
                badge.id = "fps-badge";
                badge.style.cssText = "position:fixed;top:10px;right:12px;z-index:30;color:#7ec850;background:rgba(0,0,0,0.55);padding:4px 10px;border-radius:8px;font-family:monospace;font-size:14px;";
                badge.textContent = "… FPS";
                document.addEventListener("DOMContentLoaded", () => document.body.appendChild(badge));
            }
        })();

        const $ = (id) => document.getElementById(id);
        const loadingBox = $("loading-box");
        const loadingTitle = $("loading-title");
        const loadingSub = $("loading-sub");
        const dlBar = $("dl-bar-full");
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const fmtMB = (b) => (b / (1024 * 1024)).toFixed(1);

        function getStage() {
            const s = parseInt(localStorage.getItem(LS_STAGE) || "1", 10);
            return (s >= 1 && s <= 3) ? s : 1;
        }
        function setStage(s) { localStorage.setItem(LS_STAGE, String(s)); }

        // ---------- Cache Storage ----------
        let cache = null, cacheBroken = false;
        async function openCache() {
            try { if ("caches" in window) cache = await caches.open(CACHE_NAME); }
            catch { cacheBroken = true; }
        }
        async function cacheGetBlob(url) {
            if (!cache || cacheBroken) return null;
            try { const hit = await cache.match(url); return hit ? await hit.blob() : null; }
            catch { return null; }
        }
        async function cacheHas(url) {
            if (!cache || cacheBroken) return false;
            try { return !!(await cache.match(url)); } catch { return false; }
        }
        async function cachePut(url, blob) {
            if (!cache || cacheBroken) return;
            try { await cache.put(url, new Response(blob)); }
            catch { cacheBroken = true; }
        }

        // ---------- Downloading with progress ----------
        function makeProgress(onUpdate) {
            return { total: 0, loaded: 0, doneFiles: 0, totalFiles: 0, cachedFiles: 0, aborted: false, onUpdate };
        }
        function report(p) { if (p.onUpdate) p.onUpdate(p); }

        async function pool(items, size, fn, p) {
            const results = new Array(items.length);
            let next = 0;
            async function worker() {
                while (true) {
                    if (p && p.aborted) throw new Error("aborted");
                    const i = next++;
                    if (i >= items.length) return;
                    results[i] = await fn(items[i], i);
                }
            }
            const workers = [];
            for (let k = 0; k < Math.min(size, items.length); k++) workers.push(worker());
            await Promise.all(workers);
            return results;
        }

        async function fetchBlobNetwork(url, p) {
            let lastError = null;
            for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("HTTP " + response.status);
                    const reader = response.body.getReader();
                    const chunks = [];
                    while (true) {
                        if (p && p.aborted) { try { await reader.cancel(); } catch {} throw new Error("aborted"); }
                        const { done, value } = await reader.read();
                        if (done) break;
                        if (p) { p.loaded += value.length; report(p); }
                        chunks.push(value);
                    }
                    return new Blob(chunks);
                } catch (err) {
                    if (err && err.message === "aborted") throw err;
                    lastError = err;
                    if (attempt < MAX_RETRIES) await new Promise(r => setTimeout(r, 1000 * attempt));
                }
            }
            throw lastError || new Error("fetch failed: " + url);
        }

        // Returns the Blob for url, from cache when present; counts cached
        // bytes as instantly loaded for honest progress.
        async function fetchBlob(url, sizeHint, p) {
            const cached = await cacheGetBlob(url);
            if (cached) {
                if (p) { p.loaded += cached.size; p.cachedFiles++; p.doneFiles++; report(p); }
                return cached;
            }
            const blob = await fetchBlobNetwork(url, p);
            if (p) { p.doneFiles++; report(p); }
            await cachePut(url, blob);
            return blob;
        }

        async function fetchJson(url) {
            const res = await fetch(url, { cache: "no-cache" });
            if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
            return res.json();
        }

        // ---------- Assembly ----------
        function b64ToBlob(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new Blob([bytes]);
        }
        const ZERO_1MB = new Blob([new Uint8Array(1024 * 1024)]);
        function pushZeros(parts, length) {
            let remaining = length;
            while (remaining >= ZERO_1MB.size) { parts.push(ZERO_1MB); remaining -= ZERO_1MB.size; }
            if (remaining > 0) parts.push(ZERO_1MB.slice(0, remaining));
        }

        // Ensure every segment with stage<=target and the target's patch
        // files are available; returns {segBlobs: Map, patchBlobs: Map}.
        async function ensureStageFiles(manifest, spec, target, p) {
            const segById = new Map(manifest.segments.map(s => [s.id, s]));
            const neededSegIds = new Set();
            for (const piece of spec.pieces) if (piece.t === "seg") neededSegIds.add(piece.id);
            const segItems = [...neededSegIds].map(id => {
                const s = segById.get(id);
                return { id, url: resolveParts(s.file), size: s.length };
            });
            const patchFiles = [...new Set(spec.pieces.filter(x => x.t === "patch").map(x => x.file))];
            // Patch sizes are in the pieces; HEAD not needed.
            const patchItems = patchFiles.map(f => ({
                file: f, url: resolveParts(f),
                size: spec.pieces.find(x => x.t === "patch" && x.file === f).length,
            }));
            const items = [
                ...segItems.map(x => ({ ...x, kind: "seg" })),
                ...patchItems.map(x => ({ ...x, kind: "patch" })),
            ];
            // Progress totals count only what is not already cached.
            let missingBytes = 0, missingFiles = 0;
            for (const it of items) {
                if (await cacheHas(it.url)) { p.loaded += it.size; p.cachedFiles++; p.doneFiles++; }
                else { missingBytes += it.size; missingFiles++; }
            }
            // Total for this stage = bytes already counted as loaded from
            // cache above + bytes still to download.
            p.total = p.loaded + missingBytes;
            p.totalFiles = items.length;
            report(p);
            const todoItems = [];
            const blobs = new Map();
            for (const it of items) {
                const hit = await cacheGetBlob(it.url);
                if (hit) blobs.set(it.kind + ":" + (it.id !== undefined ? it.id : it.file), hit);
                else todoItems.push(it);
            }
            await pool(todoItems, CONCURRENCY, async (it) => {
                const blob = await fetchBlob(it.url, it.size, p);
                blobs.set(it.kind + ":" + (it.id !== undefined ? it.id : it.file), blob);
            }, p);
            const segBlobs = new Map(), patchBlobs = new Map();
            for (const [k, v] of blobs) {
                if (k.startsWith("seg:")) segBlobs.set(parseInt(k.slice(4), 10), v);
                else patchBlobs.set(k.slice(6), v);
            }
            return { segBlobs, patchBlobs };
        }

        function assembleData(spec, segBlobs, patchBlobs) {
            const placeholders = {};
            for (const [u, v] of Object.entries(spec.placeholderBlocks)) placeholders[u] = b64ToBlob(v.b64);
            const parts = [];
            for (const piece of spec.pieces) {
                if (piece.t === "patch") parts.push(patchBlobs.get(piece.file));
                else if (piece.t === "seg") parts.push(segBlobs.get(piece.id));
                else if (piece.t === "zb") { const ph = placeholders[String(piece.u)]; for (let i = 0; i < piece.n; i++) parts.push(ph); }
                else if (piece.t === "zeros") pushZeros(parts, piece.length);
                else throw new Error("unknown piece " + piece.t);
            }
            const blob = new Blob(parts);
            if (blob.size !== spec.outputSize) throw new Error(" assembled size mismatch: " + blob.size + " != " + spec.outputSize);
            return URL.createObjectURL(blob);
        }

        // ---------- Wake Lock / fullscreen (from Phase 1) ----------
        let wakeLock = null;
        async function requestWakeLock() {
            try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch {}
        }
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible" && wakeLock) requestWakeLock();
        });

        // ---------- Checkpoint watcher ----------
        let watcherTimer = null;
        function decodeText(u8) {
            try { return new TextDecoder("utf-8", { fatal: false }).decode(u8); } catch { return ""; }
        }
        async function readIdbfsTexts() {
            const texts = [];
            if (!("indexedDB" in window) || !indexedDB.databases) return texts;
            let dbs = [];
            try { dbs = await indexedDB.databases(); } catch { return texts; }
            for (const info of dbs) {
                if (!info.name || !/idbfs/i.test(info.name)) continue;
                const text = await new Promise((resolve) => {
                    let req;
                    try { req = indexedDB.open(info.name); } catch { return resolve(""); }
                    req.onerror = () => resolve("");
                    req.onsuccess = () => {
                        const db = req.result;
                        const chunks = [];
                        let pending = 0, finished = false;
                        const done = () => { if (!finished) { finished = true; try { db.close(); } catch {} resolve(chunks.join("\n")); } };
                        if (!db.objectStoreNames.length) return done();
                        try {
                            const tx = db.transaction([...db.objectStoreNames], "readonly");
                            tx.oncomplete = done; tx.onerror = done;
                            for (const storeName of db.objectStoreNames) {
                                const getReq = tx.objectStore(storeName).getAll();
                                getReq.onsuccess = () => {
                                    for (const rec of getReq.result || []) {
                                        const bytes = rec && rec.contents ? rec.contents
                                            : (rec instanceof ArrayBuffer ? new Uint8Array(rec) : null);
                                        if (bytes && bytes.length) chunks.push(decodeText(bytes));
                                    }
                                };
                            }
                        } catch { done(); }
                        setTimeout(done, 4000);
                    };
                });
                if (text) texts.push(text);
            }
            return texts;
        }
        function sceneFromTexts(texts) {
            const allScenes = new Set([...(GATE_SCENES[1] || []), ...(GATE_SCENES[2] || []),
                "Town", "Crossroads_46b", "Crossroads_49b"]);
            for (const text of texts) {
                const m = text.match(/"sceneName"\s*:\s*"([A-Za-z0-9_]+)"/);
                if (m) return m[1];
            }
            for (const text of texts) {
                for (const name of allScenes) if (text.includes(name)) return name;
                const m = text.match(/Waterways_[0-9_a-z]+/);
                if (m) return m[0];
            }
            return null;
        }
        function atGate(scene, stage) {
            if (!scene || stage >= 3) return false;
            if ((GATE_SCENES[stage] || []).includes(scene)) return true;
            return (GATE_PREFIXES[stage] || []).some(pre => scene.startsWith(pre));
        }
        function startWatcher(getManifest) {
            if (watcherTimer) return;
            const tick = async () => {
                const stage = getStage();
                if (stage >= 3) return;
                const snooze = parseInt(localStorage.getItem(LS_GATE_SNOOZE) || "0", 10);
                if (Date.now() < snooze) return;
                try {
                    const scene = sceneFromTexts(await readIdbfsTexts());
                    if (scene && atGate(scene, stage)) showGateBanner(stage, getManifest());
                } catch { /* watcher is best-effort; manual button remains */ }
            };
            watcherTimer = setInterval(tick, 20000);
            document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") tick(); });
        }

        // ---------- UI: gate banner + parts panel ----------
        let manifestRef = null;
        function nextPartMiB(stage) {
            const info = manifestRef && manifestRef.stages[String(stage + 1)];
            return info ? info.upgradeDownloadMiB : null;
        }
        function showGateBanner(stage, manifest) {
            manifestRef = manifest || manifestRef;
            if (!manifestRef) return;
            const mib = nextPartMiB(stage);
            $("gate-text").textContent = `به یک چک‌پوینت رسیدی! برای ادامهٔ مسیر، پارت ${stage + 1} بازی${mib ? ` (${mib.toFixed(1)} مگابایت)` : ""} باید دانلود شود.`;
            $("gate-banner").hidden = false;
        }
        function refreshPartsPanel() {
            const stage = getStage();
            const panel = $("parts-panel");
            const info = $("parts-info");
            const dlBtn = $("parts-download");
            const fps = window.__hkFps && window.__hkFps() ? ` نرخ فریم فعلی: ${window.__hkFps()} فریم‌برثانیه.` : "";
            if (stage >= 3) {
                info.textContent = "هر سه پارت بازی نصب است. بازی کامل است ✓" + fps;
                dlBtn.hidden = true;
            } else {
                const mib = nextPartMiB(stage);
                info.textContent = `پارت ${stage} از ۳ نصب است.` + (mib ? ` پارت بعدی: ${mib.toFixed(1)} مگابایت.` : "") + fps;
                dlBtn.textContent = `دانلود پارت ${stage + 1}` + (mib ? ` (${mib.toFixed(1)} مگابایت)` : "");
                dlBtn.hidden = false;
            }
            panel.hidden = false;
        }
        async function runUpgrade() {
            const stage = getStage();
            if (stage >= 3 || !manifestRef) return;
            const target = stage + 1;
            $("gate-banner").hidden = true;
            refreshPartsPanel();
            $("parts-bar-wrap").hidden = false;
            const p = makeProgress((pp) => {
                const pct = pp.total > 0 ? Math.floor((pp.loaded / pp.total) * 100) : 0;
                $("parts-bar").style.width = pct + "%";
                $("parts-progress-text").textContent = pp.total > 0
                    ? `در حال دانلود پارت ${target}: ${fmtMB(pp.loaded)} از ${fmtMB(pp.total)} مگابایت (${pct}٪)`
                    : "در حال آماده‌سازی…";
            });
            $("parts-download").disabled = true;
            try {
                const spec = await fetchJson(resolveParts(manifestRef.stages[String(target)].spec));
                await ensureStageFiles(manifestRef, spec, target, p);
                setStage(target);
                $("parts-progress-text").textContent = `پارت ${target} دانلود شد! بازی دوباره بارگذاری می‌شود تا با همان سیو ادامه بدهی…`;
                setTimeout(() => location.reload(), 1800);
            } catch (err) {
                console.error(err);
                $("parts-progress-text").textContent = "دانلود ناموفق بود. اتصال اینترنت را بررسی و دوباره تلاش کن.";
                $("parts-download").disabled = false;
            }
        }

        // ---------- Main boot ----------
        (async () => {
            const progress = makeProgress((p) => {
                const pct = p.total > 0 ? Math.floor((p.loaded / p.total) * 100) : 0;
                dlBar.style.width = pct + "%";
                loadingSub.textContent = p.total > 0
                    ? `${fmtMB(p.loaded)} مگابایت از ${fmtMB(p.total)} مگابایت (${pct}٪) · فایل ${p.doneFiles}/${p.totalFiles}` + (p.cachedFiles ? ` · ${p.cachedFiles} فایل از کش` : "")
                    : "در حال آماده‌سازی…";
            });
            $("dl-cancel").hidden = false;
            $("dl-cancel").addEventListener("click", () => { progress.aborted = true; });
            $("dl-retry").addEventListener("click", () => location.reload());
            try {
                await openCache();
                const stage = getStage();
                loadingTitle.textContent = stage > 1 ? `در حال بارگذاری بازی (پارت ${stage})…` : "در حال دانلود و بارگذاری بازی…";
                manifestRef = await fetchJson(MANIFEST_URL);
                const spec = await fetchJson(resolveParts(manifestRef.stages[String(stage)].spec));
                const { segBlobs, patchBlobs } = await ensureStageFiles(manifestRef, spec, stage, progress);

                // Wasm via the Phase 1 route (relative to <base>), same cache.
                const wasmParts = [];
                for (let i = 1; i <= WASM_PARTS; i++) wasmParts.push(new URL("Build/hk.wasm.part" + i, document.baseURI).href);
                let wasmTotal = 0;
                for (const u of wasmParts) {
                    try { const r = await fetch(u, { method: "HEAD" }); wasmTotal += parseInt(r.headers.get("Content-Length") || "0", 10) || 0; } catch {}
                }
                progress.total += wasmTotal; progress.totalFiles += wasmParts.length; report(progress);
                const wasmBlobs = await pool(wasmParts, CONCURRENCY, (u) => fetchBlob(u, 0, progress), progress);
                const wasmUrl = URL.createObjectURL(new Blob(wasmBlobs));

                loadingTitle.textContent = "در حال آماده‌سازی بازی…";
                const dataUrl = assembleData(spec, segBlobs, patchBlobs);
                $("dl-cancel").hidden = true;

                const buildUrl = "Build";
                const config = {
                    dataUrl: dataUrl,
                    frameworkUrl: buildUrl + "/hk.framework.js",
                    codeUrl: wasmUrl,
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "Team Cherry & Truffled",
                    productName: "Hollow Knight",
                    productVersion: "1.0",
                };
                const container = $("unity-container");
                container.hidden = false;
                const canvas = $("unity-canvas");
                const loadingBar = $("unity-loading-bar");
                const progressBarFull = $("unity-progress-bar-full");
                const mobileWarning = $("unity-mobile-warning");
                const fsButton = $("fs-button");

                function fitCanvas() {
                    const w = window.innerWidth, h = window.innerHeight;
                    canvas.style.width = w + "px"; canvas.style.height = h + "px";
                    if (isMobile) {
                        // Fixed 480p internal render (M3); CSS stretches it
                        // to fullscreen. Backing store never changes size.
                        canvas.width = RENDER_W;
                        canvas.height = RENDER_H;
                    } else { canvas.width = w; canvas.height = h; }
                }
                if (isMobile) {
                    container.className = "unity-mobile";
                    config.devicePixelRatio = 1;
                    config.matchWebGLToCanvasSize = false;
                    mobileWarning.style.display = "block";
                    setTimeout(() => { mobileWarning.style.display = "none"; }, 5000);
                }
                fitCanvas();
                window.addEventListener("resize", fitCanvas);
                window.addEventListener("orientationchange", () => setTimeout(fitCanvas, 100));

                fsButton.addEventListener("click", async () => {
                    try {
                        if (document.fullscreenElement) await document.exitFullscreen();
                        else {
                            await container.requestFullscreen();
                            if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape").catch(() => {});
                        }
                    } catch {}
                    requestWakeLock();
                });
                $("parts-button").addEventListener("click", refreshPartsPanel);
                $("parts-close").addEventListener("click", () => { $("parts-panel").hidden = true; });
                $("parts-download").addEventListener("click", runUpgrade);
                $("gate-download").addEventListener("click", runUpgrade);
                $("gate-later").addEventListener("click", () => {
                    $("gate-banner").hidden = true;
                    localStorage.setItem(LS_GATE_SNOOZE, String(Date.now() + 10 * 60 * 1000));
                });

                loadingBar.style.display = "block";
                const script = document.createElement("script");
                script.src = buildUrl + "/hk.loader.js";
                script.onload = () => {
                    createUnityInstance(canvas, config, (pr) => {
                        progressBarFull.style.width = 100 * pr + "%";
                    }).then(() => {
                        loadingBox.remove();
                        loadingBar.style.display = "none";
                        canvas.style.display = "block";
                        fsButton.hidden = false;
                        $("parts-button").hidden = false;
                        requestWakeLock();
                        startWatcher(() => manifestRef);
                        setTimeout(() => { URL.revokeObjectURL(dataUrl); URL.revokeObjectURL(wasmUrl); }, 10000);
                    }).catch((message) => { alert("Game failed to load: " + message); });
                };
                script.onerror = () => { alert("Failed to load Unity loader script"); };
                document.body.appendChild(script);
            } catch (error) {
                console.error("Initialization error:", error);
                if (error && error.message === "aborted") {
                    loadingTitle.textContent = "دانلود لغو شد.";
                } else {
                    loadingTitle.textContent = "خطا در بارگذاری بازی";
                    loadingTitle.style.color = "#ff7b72";
                }
                loadingSub.textContent = String(error && error.message ? error.message : error);
                $("dl-cancel").hidden = true;
                $("dl-retry").hidden = false;
            }
        })();
    </script>
</body>

</html>
